<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DownNote: capture your notes once and find them anywhere." />
    <title>DownNote</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>DownNote</h1>
        <p>Capture your notes. Find them .</p>
      </div>
    </header>

    <main>
      <section>
        <h2>Your notes</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" role="status"></p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 DownNote. Developed by Konoha Technologies.</p>
    </footer>
  </body>
</html>
